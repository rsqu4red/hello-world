<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1046" viewBox="0 0 1200 1046" font-family="Figtree, sans-serif">
<defs><marker id="sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D2452B"/></marker></defs>
<rect width="100%" height="100%" fill="#FBFAF7"/>
<text x="30" y="46" font-size="27" font-weight="700" fill="#17160F">Sechs Hülsen statt des Knotens</text>
<text x="30" y="73" font-size="13.5" fill="#6C675A">Längsschnitte, gleicher Maßstab. Grün ist die Schnur, Orange die Hülse, Grau ein Metallteil.</text>
<text x="30" y="94" font-size="13.5" fill="#6C675A">Auslegung auf <tspan font-weight="600">1000 N</tspan> — 25 kg × 2 dynamisch × 2 Sicherheit. Reine Klemmung auf 6 mm bräuchte 43 MPa und scheidet damit aus: alle sechs arbeiten mit Formschluss.</text>
<rect x="36" y="126" width="368" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="54" y="158" font-size="16.5" font-weight="700" fill="#17160F">Knoten in der Hülse</text>
<text x="54" y="177" font-size="11.5" fill="#6C675A">Ø11 × 10 mm, zweiteilig</text>
<g><path d="M170.5 234.0 L269.5 234.0 L269.5 324.0 L240.2 324.0 L240.2 306.0 A38.2 38.2 0 0 0 199.8 306.0 L199.8 324.0 L170.5 324.0 Z" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><circle cx="220.0" cy="280.8" r="38.2" fill="#55886B" stroke="#FBFAF7" stroke-width="1.2"/><path d="M220.0 280.8 L220.0 369.0" fill="none" stroke="#55886B" stroke-width="36.0" stroke-linecap="round" stroke-linejoin="round"/><line x1="220.0" y1="230.0" x2="220.0" y2="328.0" stroke="#D2452B" stroke-width="1.3" stroke-dasharray="5 4"/><text x="220.0" y="224.0" font-size="10" fill="#D2452B" text-anchor="middle" font-family="Figtree, sans-serif">geteilt, klipst um den Knoten</text></g>
<text x="54" y="467" font-size="11.5" font-weight="600" fill="#17160F">Formschluss: der Knoten selbst</text>
<text x="54" y="488" font-size="11.5" font-weight="400" fill="#6C675A">Schulterpressung 18–24 MPa, für PA kein Problem</text>
<text x="54" y="509" font-size="11.5" font-weight="400" fill="#6C675A">knoten, zuklipsen — das Loch hält den Klips zu</text>
<text x="54" y="530" font-size="11.5" font-weight="400" fill="#6C675A">sicherste Variante, aber die größte</text>
<rect x="416" y="126" width="368" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="434" y="158" font-size="16.5" font-weight="700" fill="#17160F">Presshülse, Seil doppelt</text>
<text x="434" y="177" font-size="11.5" fill="#6C675A">Alu oder Kupfer, Ø10 × 13 mm</text>
<g><path d="M580.2 387.0 L580.2 252.0 L600.0 244.8 L619.8 252.0 L619.8 333.0" fill="none" stroke="#55886B" stroke-width="32.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M559.5 351.0 L555.0 351.0 L555.0 234.0 L559.5 234.0 Z" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><path d="M640.5 351.0 L645.0 351.0 L645.0 234.0 L640.5 234.0 Z" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><rect x="555.0" y="234.0" width="90.0" height="117.0" fill="none" stroke="#17160F" stroke-width="1.4"/><rect x="555.0" y="234.0" width="90.0" height="117.0" fill="#9AA0A6" opacity="0.35"/><line x1="510.0" y1="271.4" x2="552.0" y2="271.4" stroke="#D2452B" stroke-width="1.8" marker-end="url(#sp)"/><line x1="690.0" y1="271.4" x2="648.0" y2="271.4" stroke="#D2452B" stroke-width="1.8" marker-end="url(#sp)"/><line x1="510.0" y1="306.5" x2="552.0" y2="306.5" stroke="#D2452B" stroke-width="1.8" marker-end="url(#sp)"/><line x1="690.0" y1="306.5" x2="648.0" y2="306.5" stroke="#D2452B" stroke-width="1.8" marker-end="url(#sp)"/><text x="600.0" y="224.0" font-size="10" fill="#D2452B" text-anchor="middle" font-family="Figtree, sans-serif">Seil umgeschlagen, dann verpresst</text></g>
<text x="434" y="467" font-size="11.5" font-weight="600" fill="#17160F">Formschluss: die Umkehrschlaufe</text>
<text x="434" y="488" font-size="11.5" font-weight="400" fill="#6C675A">Standardteil, Standardzange, nichts zu entwickeln</text>
<text x="434" y="509" font-size="11.5" font-weight="400" fill="#6C675A">Nylon kriecht, die Umkehrschlaufe hält trotzdem</text>
<text x="434" y="530" font-size="11.5" font-weight="400" fill="#6C675A">Metall am Kinderprodukt: Kanten, Nickel prüfen</text>
<rect x="796" y="126" width="368" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="814" y="158" font-size="16.5" font-weight="700" fill="#17160F">Klemmkegel</text>
<text x="814" y="177" font-size="11.5" fill="#6C675A">selbsthemmend, Ø10 × 9 mm</text>
<g><path d="M947.6 234.0 L935.0 234.0 L935.0 315.0 L959.3 315.0 Z" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><path d="M1012.4 234.0 L1025.0 234.0 L1025.0 315.0 L1000.7 315.0 Z" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><path d="M961.1 244.8 L950.3 244.8 L960.6 309.6 L961.1 309.6 Z" fill="#9AA0A6" stroke="#17160F" stroke-width="1.2"/><path d="M998.9 244.8 L1009.7 244.8 L999.4 309.6 L998.9 309.6 Z" fill="#9AA0A6" stroke="#17160F" stroke-width="1.2"/><path d="M980.0 225.0 L980.0 360.0" fill="none" stroke="#55886B" stroke-width="36.0" stroke-linecap="round" stroke-linejoin="round"/><line x1="1038.5" y1="252.0" x2="1016.0" y2="306.0" stroke="#D2452B" stroke-width="1.8" marker-end="url(#sp)"/><text x="980.0" y="224.0" font-size="10" fill="#D2452B" text-anchor="middle" font-family="Figtree, sans-serif">Zug zieht den Keil tiefer</text></g>
<text x="814" y="467" font-size="11.5" font-weight="600" fill="#17160F">Formschluss: Keil im Kegel, unter Last stärker</text>
<text x="814" y="488" font-size="11.5" font-weight="400" fill="#6C675A">selbsthemmend bis 17°, praktisch 6 bis 8°</text>
<text x="814" y="509" font-size="11.5" font-weight="400" fill="#6C675A">zwei Teile, beide einfach zu spritzen</text>
<text x="814" y="530" font-size="11.5" font-weight="400" fill="#6C675A">muss vorgespannt werden, greift sonst spät</text>
<rect x="36" y="571" width="368" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="54" y="603" font-size="16.5" font-weight="700" fill="#17160F">Kapstan-Hülse</text>
<text x="54" y="622" font-size="11.5" fill="#6C675A">Umschlingung, Ø10 × 11 mm</text>
<g><rect x="175.0" y="679.0" width="90.0" height="99.0" rx="3" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><path d="M202.0 814.0 L202.0 729.4" fill="none" stroke="#55886B" stroke-width="30.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220.0" cy="716.8" r="30.6" fill="none" stroke="#55886B" stroke-width="30.6"/><circle cx="220.0" cy="716.8" r="12.6" fill="#9AA0A6" stroke="#17160F" stroke-width="1.2"/><path d="M238.0 729.4 L238.0 772.6" fill="none" stroke="#55886B" stroke-width="27.0" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="669.0" font-size="10" fill="#D2452B" text-anchor="middle" font-family="Figtree, sans-serif">1,5 Windungen: Schwanz hält 58 N</text></g>
<text x="54" y="912" font-size="11.5" font-weight="600" fill="#17160F">Formschluss: Reibung über Umschlingung, e^(µφ)</text>
<text x="54" y="933" font-size="11.5" font-weight="400" fill="#6C675A">1,5 Windungen → Faktor 17 → Schwanz nur 58 N</text>
<text x="54" y="954" font-size="11.5" font-weight="400" fill="#6C675A">schont die Fasern, nichts wird gequetscht</text>
<text x="54" y="975" font-size="11.5" font-weight="400" fill="#6C675A">Einfädeln fummelig, eher Handmontage</text>
<rect x="416" y="571" width="368" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="434" y="603" font-size="16.5" font-weight="700" fill="#17160F">Umspritzt</text>
<text x="434" y="622" font-size="11.5" fill="#6C675A">Hülse direkt an die Schnur, Ø10 × 9 mm</text>
<g><rect x="555.0" y="679.0" width="90.0" height="81.0" rx="3" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><path d="M600.0 697.0 L600.0 805.0" fill="none" stroke="#55886B" stroke-width="36.0" stroke-linecap="round" stroke-linejoin="round"/><line x1="600.0" y1="697.0" x2="572.4" y2="691.7" stroke="#55886B" stroke-width="2" stroke-linecap="round"/><line x1="600.0" y1="697.0" x2="578.8" y2="686.9" stroke="#55886B" stroke-width="2" stroke-linecap="round"/><line x1="600.0" y1="697.0" x2="588.5" y2="683.7" stroke="#55886B" stroke-width="2" stroke-linecap="round"/><line x1="600.0" y1="697.0" x2="600.0" y2="682.6" stroke="#55886B" stroke-width="2" stroke-linecap="round"/><line x1="600.0" y1="697.0" x2="611.5" y2="683.7" stroke="#55886B" stroke-width="2" stroke-linecap="round"/><line x1="600.0" y1="697.0" x2="621.2" y2="686.9" stroke="#55886B" stroke-width="2" stroke-linecap="round"/><line x1="600.0" y1="697.0" x2="627.6" y2="691.7" stroke="#55886B" stroke-width="2" stroke-linecap="round"/><text x="600.0" y="669.0" font-size="10" fill="#D2452B" text-anchor="middle" font-family="Figtree, sans-serif">Schmelze dringt ins Geflecht</text></g>
<text x="434" y="912" font-size="11.5" font-weight="600" fill="#17160F">Formschluss: Schmelze im Geflecht</text>
<text x="434" y="933" font-size="11.5" font-weight="400" fill="#6C675A">Normalfall bei Kabelenden, hält mehr als die Schnur</text>
<text x="434" y="954" font-size="11.5" font-weight="400" fill="#6C675A">ein Arbeitsgang, kein Zusatzteil, keine Montage</text>
<text x="434" y="975" font-size="11.5" font-weight="400" fill="#6C675A">Schnur wird Baugruppe: Werkzeug mit Einlage</text>
<rect x="796" y="571" width="368" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="814" y="603" font-size="16.5" font-weight="700" fill="#17160F">Vergussanker</text>
<text x="814" y="622" font-size="11.5" fill="#6C675A">Fasern gespreizt, Ø10 × 10 mm</text>
<g><path d="M944.9 679.0 L935.0 679.0 L935.0 769.0 L959.3 769.0 Z" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><path d="M1015.1 679.0 L1025.0 679.0 L1025.0 769.0 L1000.7 769.0 Z" fill="#E0982F" stroke="#17160F" stroke-width="1.4"/><path d="M944.9 679.0 L959.3 769.0 L1000.7 769.0 L1015.1 679.0 Z" fill="#9AA0A6" opacity="0.35"/><line x1="964.7" y1="769.0" x2="949.4" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><line x1="968.5" y1="769.0" x2="957.0" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><line x1="972.4" y1="769.0" x2="964.7" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><line x1="976.2" y1="769.0" x2="972.4" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><line x1="980.0" y1="769.0" x2="980.0" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><line x1="983.8" y1="769.0" x2="987.6" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><line x1="987.6" y1="769.0" x2="995.3" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><line x1="991.5" y1="769.0" x2="1003.0" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><line x1="995.3" y1="769.0" x2="1010.6" y2="684.4" stroke="#55886B" stroke-width="2.2" stroke-linecap="round"/><path d="M980.0 769.0 L980.0 814.0" fill="none" stroke="#55886B" stroke-width="36.0" stroke-linecap="round" stroke-linejoin="round"/><text x="980.0" y="669.0" font-size="10" fill="#D2452B" text-anchor="middle" font-family="Figtree, sans-serif">Fasern gespreizt, dann vergossen</text></g>
<text x="814" y="912" font-size="11.5" font-weight="600" fill="#17160F">Formschluss: jede einzelne Faser im Harz</text>
<text x="814" y="933" font-size="11.5" font-weight="400" fill="#6C675A">stärkste Variante, Prinzip der Seilendvergüsse</text>
<text x="814" y="954" font-size="11.5" font-weight="400" fill="#6C675A">Kegel unten eng: Zug verkeilt zusätzlich</text>
<text x="814" y="975" font-size="11.5" font-weight="400" fill="#6C675A">Aushärtezeit nötig, 2K oder Schmelzkleber</text>
</svg>