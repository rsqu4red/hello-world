<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1088" viewBox="0 0 860 1088" font-family="Figtree, sans-serif">
<defs><marker id="spitze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D2452B"/></marker></defs>
<rect width="100%" height="100%" fill="#FBFAF7"/>
<text x="30" y="46" font-size="27" font-weight="700" fill="#17160F">Das durchgehende Rundloch</text>
<text x="30" y="72" font-size="13.5" fill="#6C675A">Querschnitt durch den Türdrücker. Orange ist das Werkzeug beziehungsweise das zweite Teil.</text>
<text x="30" y="93" font-size="13.5" fill="#6C675A">Der Knoten hält nur bei Verengung nach unten, der Stift kommt nur bei Erweiterung nach unten heraus.</text>
<rect x="36" y="118" width="388" height="454" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="56" y="150" font-size="17" font-weight="700" fill="#17160F">So wie vorgeschlagen</text>
<text x="56" y="170" font-size="11.5" fill="#6C675A">Ø10 durchgehend bis in die Bohrung</text>
<g><circle cx="230.0" cy="278.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><circle cx="230.0" cy="320.9" r="33.1" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><path d="M179.3 278.0 a50.7 50.7 0 1 0 101.4 0.0 a50.7 50.7 0 1 0 -101.4 0.0 Z M191.0 278.0 a39.0 39.0 0 1 1 78.0 0.0 a39.0 39.0 0 1 1 -78.0 0.0 Z" fill="#B9C8BE" fill-rule="evenodd" stroke="#17160F" stroke-width="1.6"/><rect x="210.5" y="317.0" width="39.0" height="72.1" rx="1.5" fill="#E0982F" opacity="0.45" stroke="#17160F" stroke-width="1.1"/><rect x="210.5" y="317.0" width="39.0" height="37.1" fill="none" stroke="#17160F" stroke-width="1.3"/><line x1="230.0" y1="373.6" x2="230.0" y2="400.9" stroke="#D2452B" stroke-width="1.8" marker-end="url(#spitze)"/><text x="257.3" y="393.1" font-size="10" fill="#E0982F" text-anchor="start" font-family="Figtree, sans-serif">Stift gerade heraus</text><circle cx="230.0" cy="381.4" r="15.6" fill="#55886B" stroke="#FBFAF7" stroke-width="1.2"/><text x="202.7" y="385.2" font-size="10" fill="#D2452B" text-anchor="end" font-family="Figtree, sans-serif">Ø8 fällt durch Ø10</text></g>
<text x="56" y="504" font-size="11.5" fill="#17160F">Werkzeug: ein gerader Stift</text>
<text x="56" y="523" font-size="11.5" fill="#6C675A">kein Schieber, kein Hinterschnitt</text>
<text x="56" y="542" font-size="11.5" fill="#D2452B">aber: der Knoten hält nicht</text>
<rect x="436" y="118" width="388" height="454" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="456" y="150" font-size="17" font-weight="700" fill="#17160F">Mit Stufe Ø4</text>
<text x="456" y="170" font-size="11.5" fill="#6C675A">damit der Knoten sich abstützen kann</text>
<g><circle cx="630.0" cy="278.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><circle cx="630.0" cy="320.9" r="33.1" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><path d="M579.3 278.0 a50.7 50.7 0 1 0 101.4 0.0 a50.7 50.7 0 1 0 -101.4 0.0 Z M591.0 278.0 a39.0 39.0 0 1 1 78.0 0.0 a39.0 39.0 0 1 1 -78.0 0.0 Z" fill="#B9C8BE" fill-rule="evenodd" stroke="#17160F" stroke-width="1.6"/><path d="M610.5 317.0 L610.5 342.4 L622.2 342.4 L622.2 354.1 L637.8 354.1 L637.8 342.4 L649.5 342.4 L649.5 317.0 Z" fill="#FBFAF7" stroke="#17160F" stroke-width="1.3"/><circle cx="630.0" cy="328.7" r="15.6" fill="#55886B" stroke="#FBFAF7" stroke-width="1.2"/><path d="M630.0 328.7 L630.0 395.0" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="610.5" y="317.0" width="39.0" height="25.3" rx="1.5" fill="#E0982F" opacity="0.45" stroke="#17160F" stroke-width="1.1"/><rect x="622.2" y="342.4" width="15.6" height="42.9" rx="1.5" fill="#E0982F" opacity="0.45" stroke="#17160F" stroke-width="1.1"/><line x1="665.1" y1="352.1" x2="641.7" y2="344.3" stroke="#D2452B" stroke-width="1.8" marker-end="url(#spitze)"/><text x="669.0" y="356.0" font-size="10" fill="#D2452B" text-anchor="start" font-family="Figtree, sans-serif">Schulter muss durch Ø4</text><text x="669.0" y="371.6" font-size="10" fill="#D2452B" text-anchor="start" font-family="Figtree, sans-serif">150 % Dehnung</text></g>
<text x="456" y="504" font-size="11.5" fill="#17160F">Knoten hält sicher</text>
<text x="456" y="523" font-size="11.5" fill="#6C675A">Stift nach unten: 150 % Dehnung</text>
<text x="456" y="542" font-size="11.5" fill="#D2452B">Stift nach oben: zwei Bewegungen</text>
<rect x="36" y="588" width="388" height="454" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="56" y="620" font-size="17" font-weight="700" fill="#17160F">Zwei Teile</text>
<text x="56" y="640" font-size="11.5" fill="#6C675A">die Schulter steckt im Stopfen</text>
<g><circle cx="230.0" cy="748.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><circle cx="230.0" cy="790.9" r="33.1" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><path d="M179.3 748.0 a50.7 50.7 0 1 0 101.4 0.0 a50.7 50.7 0 1 0 -101.4 0.0 Z M191.0 748.0 a39.0 39.0 0 1 1 78.0 0.0 a39.0 39.0 0 1 1 -78.0 0.0 Z" fill="#B9C8BE" fill-rule="evenodd" stroke="#17160F" stroke-width="1.6"/><rect x="210.5" y="787.0" width="39.0" height="37.0" fill="#FBFAF7" stroke="#17160F" stroke-width="1.3"/><path d="M202.7 782.3 L257.3 782.3 L257.3 787.8 L248.3 787.8 L248.3 812.4 L211.7 812.4 L211.7 787.8 L202.7 787.8 Z" fill="#E0982F" stroke="#17160F" stroke-width="1.3"/><circle cx="230.0" cy="795.6" r="11.7" fill="#55886B" stroke="#FBFAF7" stroke-width="1.2"/><path d="M230.0 795.6 L230.0 865.0" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="183.2" y1="762.8" x2="200.8" y2="782.3" stroke="#D2452B" stroke-width="1.8" marker-end="url(#spitze)"/><text x="179.3" y="758.9" font-size="10" fill="#E0982F" text-anchor="end" font-family="Figtree, sans-serif">Bund trägt</text></g>
<text x="56" y="974" font-size="11.5" fill="#17160F">Manschette: Rohr mit geradem Loch</text>
<text x="56" y="993" font-size="11.5" fill="#6C675A">Stopfen trägt Ø4 und Bund</text>
<text x="56" y="1012" font-size="11.5" fill="#E0982F">Bund baut ~1 mm in die Bohrung</text>
<rect x="436" y="588" width="388" height="454" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="456" y="620" font-size="17" font-weight="700" fill="#17160F">Der eigentliche Gewinn</text>
<text x="456" y="640" font-size="11.5" fill="#6C675A">Trennebene waagerecht legen</text>
<g><circle cx="630.0" cy="748.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><circle cx="630.0" cy="790.9" r="33.1" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><path d="M579.3 748.0 a50.7 50.7 0 1 0 101.4 0.0 a50.7 50.7 0 1 0 -101.4 0.0 Z M591.0 748.0 a39.0 39.0 0 1 1 78.0 0.0 a39.0 39.0 0 1 1 -78.0 0.0 Z" fill="#B9C8BE" fill-rule="evenodd" stroke="#17160F" stroke-width="1.6"/><rect x="610.5" y="787.0" width="39.0" height="91.6" rx="1.5" fill="#E0982F" opacity="0.45" stroke="#17160F" stroke-width="1.1"/><rect x="610.5" y="787.0" width="39.0" height="37.0" fill="none" stroke="#17160F" stroke-width="1.3"/><line x1="528.6" y1="748.0" x2="731.4" y2="748.0" stroke="#D2452B" stroke-width="1.6" stroke-dasharray="8 5"/><text x="731.4" y="736.3" font-size="10" fill="#D2452B" text-anchor="end" font-family="Figtree, sans-serif">Trennebene</text><line x1="552.0" y1="870.9" x2="708.0" y2="870.9" stroke="#6C675A" stroke-width="1.4"/><text x="630.0" y="890.4" font-size="10" fill="#6C675A" text-anchor="middle" font-family="Figtree, sans-serif">Stift steht fest in der unteren Hälfte</text></g>
<text x="456" y="974" font-size="11.5" fill="#17160F">Stift ohne jede Mechanik</text>
<text x="456" y="993" font-size="11.5" fill="#6C675A">Teil wird von ihm abgezogen</text>
<text x="456" y="1012" font-size="11.5" fill="#6C675A">gilt für alle drei oben</text>
</svg>