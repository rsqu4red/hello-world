<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f2efe6"/>
    </linearGradient>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="url(#sky)"/>

  <!-- ================= Giebelansicht (West) ================= -->
  <!-- Skala 34 px/m. Breite 6,75m=230px. Traufe 3,90m=133px, First ca. 5,27m=179px -->
  <g transform="translate(90,90)">
    <text x="115" y="-28" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Ansicht West (Giebel)</text>
    <!-- Gelände -->
    <line x1="-50" y1="320" x2="290" y2="320" stroke="#5e8a4f" stroke-width="3"/>
    <!-- Wand -->
    <rect x="0" y="187" width="230" height="133" fill="#e3d3b4" stroke="#8c7a5c" stroke-width="2"/>
    <!-- horizontale Schalung (helle Lärche) -->
    <g stroke="#cbb995" stroke-width="1">
      <line x1="0" y1="197" x2="230" y2="197"/><line x1="0" y1="207" x2="230" y2="207"/>
      <line x1="0" y1="217" x2="230" y2="217"/><line x1="0" y1="227" x2="230" y2="227"/>
      <line x1="0" y1="237" x2="230" y2="237"/><line x1="0" y1="247" x2="230" y2="247"/>
      <line x1="0" y1="257" x2="230" y2="257"/><line x1="0" y1="267" x2="230" y2="267"/>
      <line x1="0" y1="277" x2="230" y2="277"/><line x1="0" y1="287" x2="230" y2="287"/>
      <line x1="0" y1="297" x2="230" y2="297"/><line x1="0" y1="307" x2="230" y2="307"/>
    </g>
    <!-- Giebeldreieck mit Verglasung -->
    <polygon points="0,187 115,141 230,187" fill="#e9dfc9" stroke="#8c7a5c" stroke-width="2"/>
    <polygon points="55,187 115,163 175,187" fill="#a9cdd6" stroke="#7c8a8e" stroke-width="1.5"/>
    <!-- Stehfalz-Dach 22°, hellgrau -->
    <polygon points="-16,193 115,140 246,193 246,185 115,132 -16,185" fill="#9aa0a6" stroke="#6d7278" stroke-width="1.5"/>
    <!-- Große Eckverglasung EG (Referenz Maine-Cabin) -->
    <rect x="14" y="210" width="120" height="110" fill="#a9cdd6" stroke="#7c8a8e" stroke-width="2"/>
    <line x1="74" y1="210" x2="74" y2="320" stroke="#7c8a8e" stroke-width="1.5"/>
    <rect x="158" y="222" width="52" height="64" fill="#a9cdd6" stroke="#7c8a8e" stroke-width="2"/>
    <!-- Holzdeck vor dem Haus -->
    <rect x="-44" y="320" width="290" height="8" fill="#d9c6a0" stroke="#8c7a5c" stroke-width="1"/>
    <text x="-40" y="342" font-size="10.5" fill="#8c7a5c">aufgeständertes Holzdeck</text>
    <!-- Maßketten -->
    <line x1="262" y1="320" x2="262" y2="132" stroke="#444" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
    <text x="272" y="230" font-size="12" fill="#444">First ≤ 5,50 m</text>
    <line x1="-32" y1="320" x2="-32" y2="187" stroke="#444" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
    <text x="-42" y="253" font-size="12" fill="#444" text-anchor="middle" transform="rotate(-90 -42 253)">Traufe ca. 3,90 m</text>
    <line x1="0" y1="352" x2="230" y2="352" stroke="#444" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
    <text x="115" y="369" font-size="12" fill="#444" text-anchor="middle">6,75 m</text>
    <text x="180" y="156" font-size="12" fill="#333">22°</text>
  </g>

  <!-- ================= Ansicht Süd (Traufseite) ================= -->
  <g transform="translate(520,90)">
    <text x="163" y="-28" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Ansicht Süd (Traufseite)</text>
    <line x1="-40" y1="320" x2="380" y2="320" stroke="#5e8a4f" stroke-width="3"/>
    <!-- Wand -->
    <rect x="0" y="187" width="326" height="133" fill="#e3d3b4" stroke="#8c7a5c" stroke-width="2"/>
    <g stroke="#cbb995" stroke-width="1">
      <line x1="0" y1="197" x2="326" y2="197"/><line x1="0" y1="207" x2="326" y2="207"/>
      <line x1="0" y1="217" x2="326" y2="217"/><line x1="0" y1="227" x2="326" y2="227"/>
      <line x1="0" y1="237" x2="326" y2="237"/><line x1="0" y1="247" x2="326" y2="247"/>
      <line x1="0" y1="257" x2="326" y2="257"/><line x1="0" y1="267" x2="326" y2="267"/>
      <line x1="0" y1="277" x2="326" y2="277"/><line x1="0" y1="287" x2="326" y2="287"/>
      <line x1="0" y1="297" x2="326" y2="297"/><line x1="0" y1="307" x2="326" y2="307"/>
    </g>
    <!-- Dachband mit Stehfalz-Linien -->
    <rect x="-20" y="166" width="366" height="21" fill="#9aa0a6" stroke="#6d7278" stroke-width="1.5"/>
    <g stroke="#7d8288" stroke-width="1">
      <line x1="8" y1="166" x2="8" y2="187"/><line x1="36" y1="166" x2="36" y2="187"/><line x1="64" y1="166" x2="64" y2="187"/>
      <line x1="92" y1="166" x2="92" y2="187"/><line x1="120" y1="166" x2="120" y2="187"/><line x1="148" y1="166" x2="148" y2="187"/>
      <line x1="176" y1="166" x2="176" y2="187"/><line x1="204" y1="166" x2="204" y2="187"/><line x1="232" y1="166" x2="232" y2="187"/>
      <line x1="260" y1="166" x2="260" y2="187"/><line x1="288" y1="166" x2="288" y2="187"/><line x1="316" y1="166" x2="316" y2="187"/>
    </g>
    <text x="163" y="160" font-size="11" fill="#6d7278" text-anchor="middle">beschichtetes Stehfalz-Metalldach 22° (nichtbrennbar) · Zisterne · opt. Indach-PV</text>
    <!-- Große Schiebeverglasung zum Deck -->
    <rect x="20" y="204" width="180" height="116" fill="#a9cdd6" stroke="#7c8a8e" stroke-width="2"/>
    <line x1="110" y1="204" x2="110" y2="320" stroke="#7c8a8e" stroke-width="1.5"/>
    <line x1="65" y1="204" x2="65" y2="320" stroke="#9db8bf" stroke-width="1"/>
    <line x1="155" y1="204" x2="155" y2="320" stroke="#9db8bf" stroke-width="1"/>
    <text x="110" y="336" font-size="10.5" fill="#7c8a8e" text-anchor="middle">Schiebeverglasung zum Deck</text>
    <!-- Schiebeladen (Referenz Maine: verschiebbares Fassadenelement) -->
    <rect x="210" y="204" width="70" height="116" fill="#d9c6a0" stroke="#8c7a5c" stroke-width="2"/>
    <g stroke="#bfa87e" stroke-width="1">
      <line x1="210" y1="222" x2="280" y2="222"/><line x1="210" y1="240" x2="280" y2="240"/>
      <line x1="210" y1="258" x2="280" y2="258"/><line x1="210" y1="276" x2="280" y2="276"/>
      <line x1="210" y1="294" x2="280" y2="294"/><line x1="210" y1="312" x2="280" y2="312"/>
    </g>
    <text x="245" y="336" font-size="10.5" fill="#8c7a5c" text-anchor="middle">Schiebeladen Holz</text>
    <!-- kleines Fenster -->
    <rect x="292" y="218" width="26" height="46" fill="#a9cdd6" stroke="#7c8a8e" stroke-width="2"/>
    <!-- Holzdeck -->
    <rect x="-30" y="320" width="380" height="8" fill="#d9c6a0" stroke="#8c7a5c" stroke-width="1"/>
    <!-- Maß -->
    <line x1="0" y1="352" x2="326" y2="352" stroke="#444" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
    <text x="163" y="369" font-size="12" fill="#444" text-anchor="middle">9,60 m</text>
  </g>

  <!-- Fußzeile -->
  <g transform="translate(90,505)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#333">Konzept-Ansichten · Wochenendhaus Flst. 7348, Bammental</text>
    <text x="0" y="20" font-size="11.5" fill="#8a8578">Skandinavische Anmutung nach Referenzbildern: helle horizontale Holzschalung (vergrauend), Stehfalz-Metalldach, große Schiebeverglasung, Schiebeläden, Holzdeck</text>
    <text x="0" y="36" font-size="11.5" fill="#8a8578">EG 64,8 m² + Galerie im Dachraum (kein Vollgeschoss, Belichtung über Giebel) · alle Maße konform B-Plan · Dachneigung zwingend 22°</text>
  </g>
</svg>
