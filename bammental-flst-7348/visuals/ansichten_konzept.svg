<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f2efe6"/>
    </linearGradient>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <g id="holz">
      <line x1="0" y1="0" x2="0" y2="200" stroke="#9a7b52" stroke-width="1"/>
    </g>
  </defs>
  <rect width="960" height="560" fill="url(#sky)"/>

  <!-- ================= Giebelansicht (West) ================= -->
  <!-- Skala 34 px/m. Breite 6,75m=230px. Traufe 3,90m=133px, First 5,27m=179px -->
  <g transform="translate(90,90)">
    <text x="115" y="-28" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Ansicht West (Giebel)</text>
    <!-- Gelände -->
    <line x1="-50" y1="320" x2="290" y2="320" stroke="#5e8a4f" stroke-width="3"/>
    <!-- Wand: OKFF bei y=316 (EFH +0,15) -->
    <rect x="0" y="187" width="230" height="133" fill="#c8a878" stroke="#5f4a30" stroke-width="2"/>
    <!-- Holzschalung vertikal -->
    <g stroke="#a5885e" stroke-width="1">
      <line x1="14" y1="187" x2="14" y2="320"/><line x1="28" y1="187" x2="28" y2="320"/><line x1="42" y1="187" x2="42" y2="320"/>
      <line x1="56" y1="187" x2="56" y2="320"/><line x1="70" y1="187" x2="70" y2="320"/><line x1="84" y1="187" x2="84" y2="320"/>
      <line x1="98" y1="187" x2="98" y2="320"/><line x1="112" y1="187" x2="112" y2="320"/><line x1="126" y1="187" x2="126" y2="320"/>
      <line x1="140" y1="187" x2="140" y2="320"/><line x1="154" y1="187" x2="154" y2="320"/><line x1="168" y1="187" x2="168" y2="320"/>
      <line x1="182" y1="187" x2="182" y2="320"/><line x1="196" y1="187" x2="196" y2="320"/><line x1="210" y1="187" x2="210" y2="320"/>
      <line x1="224" y1="187" x2="224" y2="320"/>
    </g>
    <!-- Giebeldreieck mit Verglasung -->
    <polygon points="0,187 115,141 230,187" fill="#e9dfc9" stroke="#5f4a30" stroke-width="2"/>
    <polygon points="60,187 115,165 170,187" fill="#9fc4cc" stroke="#5f4a30" stroke-width="1.5"/>
    <!-- Dach 22°, Überstand Ortgang 0.4m=14px -->
    <polygon points="-16,193 115,140 246,193 246,186 115,133 -16,186" fill="#4a4a4a" stroke="#333" stroke-width="1.5"/>
    <!-- Fenster EG -->
    <rect x="30" y="215" width="60" height="80" fill="#9fc4cc" stroke="#5f4a30" stroke-width="2"/>
    <rect x="140" y="215" width="60" height="80" fill="#9fc4cc" stroke="#5f4a30" stroke-width="2"/>
    <!-- Maßketten -->
    <line x1="262" y1="320" x2="262" y2="133" stroke="#444" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
    <text x="272" y="230" font-size="12" fill="#444">First ≤ 5,50 m</text>
    <line x1="-32" y1="320" x2="-32" y2="187" stroke="#444" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
    <text x="-42" y="253" font-size="12" fill="#444" text-anchor="middle" transform="rotate(-90 -42 253)">Traufe ca. 3,90 m</text>
    <line x1="0" y1="345" x2="230" y2="345" stroke="#444" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
    <text x="115" y="362" font-size="12" fill="#444" text-anchor="middle">6,75 m</text>
    <!-- Winkel -->
    <text x="180" y="158" font-size="12" fill="#333">22°</text>
  </g>

  <!-- ================= Ansicht Süd (Traufseite) ================= -->
  <!-- Breite 9,6m=326px -->
  <g transform="translate(520,90)">
    <text x="163" y="-28" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Ansicht Süd (Traufseite)</text>
    <line x1="-40" y1="320" x2="380" y2="320" stroke="#5e8a4f" stroke-width="3"/>
    <!-- Wand -->
    <rect x="0" y="187" width="326" height="133" fill="#c8a878" stroke="#5f4a30" stroke-width="2"/>
    <g stroke="#a5885e" stroke-width="1">
      <line x1="16" y1="187" x2="16" y2="320"/><line x1="32" y1="187" x2="32" y2="320"/><line x1="48" y1="187" x2="48" y2="320"/>
      <line x1="64" y1="187" x2="64" y2="320"/><line x1="80" y1="187" x2="80" y2="320"/><line x1="96" y1="187" x2="96" y2="320"/>
      <line x1="112" y1="187" x2="112" y2="320"/><line x1="128" y1="187" x2="128" y2="320"/><line x1="144" y1="187" x2="144" y2="320"/>
      <line x1="160" y1="187" x2="160" y2="320"/><line x1="176" y1="187" x2="176" y2="320"/><line x1="192" y1="187" x2="192" y2="320"/>
      <line x1="208" y1="187" x2="208" y2="320"/><line x1="224" y1="187" x2="224" y2="320"/>
    </g>
    <!-- Dachfläche in Ansicht: Trauflinie, Überstand 0,6m=20px -->
    <rect x="-20" y="168" width="366" height="19" fill="#4a4a4a" stroke="#333" stroke-width="1.5"/>
    <text x="163" y="182" font-size="11" fill="#ddd" text-anchor="middle">Satteldach 22° · nichtbrennbare Eindeckung · Zisterne · opt. Indach-PV</text>
    <!-- überdachter Freisitz (Einschnitt) rechts -->
    <rect x="240" y="187" width="86" height="133" fill="#efe7d4" stroke="#5f4a30" stroke-width="2"/>
    <line x1="322" y1="187" x2="322" y2="320" stroke="#5f4a30" stroke-width="6"/>
    <text x="281" y="290" font-size="11" fill="#6d6350" text-anchor="middle">überdachter</text>
    <text x="281" y="304" font-size="11" fill="#6d6350" text-anchor="middle">Freisitz</text>
    <!-- große Verglasung Wohnraum -->
    <rect x="24" y="207" width="120" height="113" fill="#9fc4cc" stroke="#5f4a30" stroke-width="2"/>
    <line x1="84" y1="207" x2="84" y2="320" stroke="#5f4a30" stroke-width="1.5"/>
    <!-- Fenster -->
    <rect x="170" y="215" width="50" height="70" fill="#9fc4cc" stroke="#5f4a30" stroke-width="2"/>
    <!-- Maß -->
    <line x1="0" y1="345" x2="326" y2="345" stroke="#444" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
    <text x="163" y="362" font-size="12" fill="#444" text-anchor="middle">9,60 m</text>
  </g>

  <!-- Fußzeile -->
  <g transform="translate(90,505)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#333">Konzept-Ansichten · Wochenendhaus Flst. 7348, Bammental</text>
    <text x="0" y="20" font-size="11.5" fill="#8a8578">Holzrahmenbau, Lärche vorvergraut · EG 64,8 m² + Galerie im Dachraum (kein Vollgeschoss, Belichtung über Giebel — Dachaufbauten unzulässig)</text>
    <text x="0" y="36" font-size="11.5" fill="#8a8578">Alle Maße konform B-Plan „Wochenendhausgebiet – 1. Änderung (Neufassung)“</text>
  </g>
</svg>
