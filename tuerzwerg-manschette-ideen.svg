<svg xmlns="http://www.w3.org/2000/svg" width="1215" height="1477" viewBox="0 0 1215 1477" font-family="Figtree, sans-serif">
<defs><marker id="spitze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D2452B"/></marker></defs>
<rect width="100%" height="100%" fill="#FBFAF7"/>
<text x="30" y="46" font-size="27" font-weight="700" fill="#17160F">Neun Wege, die Schnur zu befestigen</text>
<text x="30" y="70" font-size="13.5" fill="#6C675A">Alles im selben Maßstab. Grün ist die Schnur, Orange das zweite Teil. Sechs Querschnitte, drei Seitenansichten — je nachdem, was die Idee zeigt.</text>
<text x="30" y="89" font-size="13.5" fill="#6C675A">Die Frage ist nicht, wie der Kern herauskommt — sondern ob der Knoten überhaupt in die Manschette muss.</text>
<rect x="36" y="112" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="54" y="142" font-size="16.5" font-weight="700" fill="#17160F">Heute</text>
<text x="54" y="162" font-size="11.5" fill="#6C675A">Kammer an der Bohrung</text>
<g><circle cx="222.5" cy="280.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><path d="M243.7 312.7 A39.0 39.0 0 1 0 201.3 312.7 L194.9 322.5 A50.7 50.7 0 1 1 250.1 322.5 Z" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><path d="M189.4 315.1 L189.4 356.1 A11.7 11.7 0 0 0 201.1 367.8 L243.9 367.8 A11.7 11.7 0 0 0 255.6 356.1 L255.6 315.1 Z" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><rect x="201.1" y="272.2" width="42.9" height="70.2" rx="9.8" fill="#FBFAF7" stroke="#17160F" stroke-width="1.2"/><circle cx="222.5" cy="322.9" r="15.6" fill="#55886B" stroke="#FBFAF7" stroke-width="1.2"/><path d="M222.5 322.9 L222.5 397.0" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="259.6" y1="256.6" x2="259.6" y2="276.1" stroke="#D2452B" stroke-width="1.8" marker-end="url(#spitze)"/><text x="265.4" y="248.8" font-size="10" fill="#D2452B" text-anchor="start" font-family="Figtree, sans-serif">Ring hier offen</text></g>
<text x="54" y="473" font-size="11.5" fill="#17160F">Werkzeug: Kern + Schieber</text>
<text x="54" y="492" font-size="11.5" fill="#6C675A">Ring nur auf 12 % zu</text>
<text x="54" y="511" font-size="11.5" fill="#6C675A">Knotenraum 5–7,5 mm</text>
<text x="391" y="142" font-size="11.5" fill="#D2452B" text-anchor="end">heutiger Stand</text>
<rect x="421" y="112" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="439" y="142" font-size="16.5" font-weight="700" fill="#17160F">Quertasche</text>
<text x="439" y="162" font-size="11.5" fill="#6C675A">Tasche unter dem Rohr, quer durch</text>
<g><circle cx="607.5" cy="280.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><path d="M556.8 280.0 a50.7 50.7 0 1 0 101.4 0.0 a50.7 50.7 0 1 0 -101.4 0.0 Z M568.5 280.0 a39.0 39.0 0 1 1 78.0 0.0 a39.0 39.0 0 1 1 -78.0 0.0 Z" fill="#B9C8BE" fill-rule="evenodd" stroke="#17160F" stroke-width="1.6"/><path d="M580.2 315.1 L580.2 358.0 A27.3 27.3 0 0 0 634.8 358.0 L634.8 315.1 Z" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><rect x="584.1" y="326.8" width="46.8" height="33.1" rx="9.8" fill="#FBFAF7" stroke="#17160F" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="607.5" cy="342.4" r="15.6" fill="#55886B" stroke="#FBFAF7" stroke-width="1.2"/><path d="M607.5 342.4 L607.5 404.8" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="439" y="473" font-size="11.5" fill="#17160F">Werkzeug: 2 Hälften + Kern</text>
<text x="439" y="492" font-size="11.5" fill="#6C675A">Ring auf 87 % zu</text>
<text x="439" y="511" font-size="11.5" fill="#6C675A">Knotenraum 8,5 mm, +3,5 mm hoch</text>
<rect x="806" y="112" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="824" y="142" font-size="16.5" font-weight="700" fill="#17160F">Umschlingung</text>
<text x="824" y="162" font-size="11.5" fill="#6C675A">Schnur liegt in einer umlaufenden Nut</text>
<g><rect x="902.8" y="241.0" width="179.4" height="78.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><rect x="937.9" y="229.3" width="42.9" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="937.9" y="319.0" width="42.9" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="980.8" y="239.4" width="23.4" height="1.6" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="980.8" y="319.0" width="23.4" height="1.6" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="1004.2" y="229.3" width="42.9" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="1004.2" y="319.0" width="42.9" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><circle cx="992.5" cy="231.6" r="7.8" fill="#55886B"/><circle cx="992.5" cy="328.4" r="7.8" fill="#55886B"/><path d="M992.5 328.4 L992.5 381.4" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="934.0" y1="194.2" x2="980.8" y2="221.5" stroke="#D2452B" stroke-width="1.8" marker-end="url(#spitze)"/><line x1="934.0" y1="365.8" x2="980.8" y2="338.5" stroke="#D2452B" stroke-width="1.8" marker-end="url(#spitze)"/><text x="992.5" y="178.6" font-size="10" fill="#D2452B" text-anchor="middle" font-family="Figtree, sans-serif">Zug zieht die Manschette zu</text></g>
<text x="824" y="473" font-size="11.5" fill="#17160F">Werkzeug: 2 Hälften + Kern</text>
<text x="824" y="492" font-size="11.5" fill="#6C675A">Ring bleibt ganz zu</text>
<text x="824" y="511" font-size="11.5" fill="#6C675A">Zug erhöht die Klemmkraft</text>
<rect x="36" y="557" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="54" y="587" font-size="16.5" font-weight="700" fill="#17160F">Drückerschlaufe</text>
<text x="54" y="607" font-size="11.5" fill="#6C675A">Schnur schlingt um den Drücker selbst</text>
<g><circle cx="222.5" cy="725.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><circle cx="222.5" cy="725.0" r="46.8" fill="none" stroke="#55886B" stroke-width="15.6"/><path d="M232.9 778.6 A54.6 54.6 0 1 0 212.1 778.6 L209.8 790.1 A66.3 66.3 0 1 1 235.2 790.1 Z" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><path d="M222.5 771.8 L222.5 849.8" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/><text x="222.5" y="631.4" font-size="10" fill="#6C675A" text-anchor="middle" font-family="Figtree, sans-serif">Manschette nur Abdeckung</text></g>
<text x="54" y="918" font-size="11.5" fill="#17160F">Werkzeug: 2 Hälften + Kern</text>
<text x="54" y="937" font-size="11.5" fill="#6C675A">Manschette ohne jedes Merkmal</text>
<text x="54" y="956" font-size="11.5" fill="#6C675A">Schlaufe kann axial wandern</text>
<rect x="421" y="557" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="439" y="587" font-size="16.5" font-weight="700" fill="#17160F">Quersteg</text>
<text x="439" y="607" font-size="11.5" fill="#6C675A">Ankerstich um einen Steg im Kiel</text>
<g><circle cx="607.5" cy="725.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><path d="M556.8 725.0 a50.7 50.7 0 1 0 101.4 0.0 a50.7 50.7 0 1 0 -101.4 0.0 Z M568.5 725.0 a39.0 39.0 0 1 1 78.0 0.0 a39.0 39.0 0 1 1 -78.0 0.0 Z" fill="#B9C8BE" fill-rule="evenodd" stroke="#17160F" stroke-width="1.6"/><path d="M580.2 760.1 L580.2 797.1 A27.3 27.3 0 0 0 634.8 797.1 L634.8 760.1 Z" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><rect x="588.0" y="767.9" width="39.0" height="21.4" rx="7.0" fill="#FBFAF7" stroke="#17160F" stroke-width="1.2"/><text x="640.6" y="803.0" font-size="10" fill="#6C675A" text-anchor="start" font-family="Figtree, sans-serif">Steg</text><line x1="636.8" y1="799.1" x2="619.2" y2="795.2" stroke="#6C675A" stroke-width="1"/><path d="M597.4 771.8 L597.4 801.0 L617.6 801.0 L617.6 771.8" fill="none" stroke="#55886B" stroke-width="11.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M607.5 769.9 L607.5 849.8" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="439" y="918" font-size="11.5" fill="#17160F">Werkzeug: 2 Hälften + Kern</text>
<text x="439" y="937" font-size="11.5" fill="#6C675A">kein Knoten nötig</text>
<text x="439" y="956" font-size="11.5" fill="#6C675A">Steg biegt sich unter Last</text>
<rect x="806" y="557" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="824" y="587" font-size="16.5" font-weight="700" fill="#17160F">Einteilig</text>
<text x="824" y="607" font-size="11.5" fill="#6C675A">Manschette, Band und Reif in einem Schuss</text>
<g><circle cx="992.5" cy="725.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><path d="M941.8 725.0 a50.7 50.7 0 1 0 101.4 0.0 a50.7 50.7 0 1 0 -101.4 0.0 Z M953.5 725.0 a39.0 39.0 0 1 1 78.0 0.0 a39.0 39.0 0 1 1 -78.0 0.0 Z" fill="#B9C8BE" fill-rule="evenodd" stroke="#17160F" stroke-width="1.6"/><path d="M980.8 764.0 L980.8 865.4 L1004.2 865.4 L1004.2 764.0 Z" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><ellipse cx="992.5" cy="888.8" rx="35.1" ry="25.3" fill="none" stroke="#B9C8BE" stroke-width="15.6"/><ellipse cx="992.5" cy="888.8" rx="35.1" ry="25.3" fill="none" stroke="#17160F" stroke-width="1.4"/><text x="1015.9" y="810.8" font-size="10" fill="#D2452B" text-anchor="start" font-family="Figtree, sans-serif">alles ein Teil</text></g>
<text x="824" y="918" font-size="11.5" fill="#17160F">Werkzeug: groß, aber einfach</text>
<text x="824" y="937" font-size="11.5" fill="#6C675A">keine Montage, keine Schnur</text>
<text x="824" y="956" font-size="11.5" fill="#6C675A">Band dehnt sich ~15 mm</text>
<rect x="36" y="1002" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="54" y="1032" font-size="16.5" font-weight="700" fill="#17160F">Knebel  ·  2 Teile</text>
<text x="54" y="1052" font-size="11.5" fill="#6C675A">Knebel an der Schnur, längs eingeschoben</text>
<g><rect x="132.8" y="1131.0" width="179.4" height="78.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><rect x="167.9" y="1119.3" width="109.2" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="167.9" y="1209.0" width="109.2" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="199.1" y="1213.7" width="46.8" height="19.5" rx="5.5" fill="#E0982F" stroke="#17160F" stroke-width="1.2"/><path d="M187.4 1211.3 L277.1 1211.3" stroke="#6C675A" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><line x1="288.8" y1="1222.7" x2="261.5" y2="1222.7" stroke="#D2452B" stroke-width="1.8" marker-end="url(#spitze)"/><path d="M222.5 1224.6 L222.5 1271.4" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/><text x="222.5" y="1271.4" font-size="10" fill="#E0982F" text-anchor="middle" font-family="Figtree, sans-serif">wird von der Seite eingeschoben</text></g>
<text x="54" y="1363" font-size="11.5" fill="#17160F">Werkzeug: 2 × trivial</text>
<text x="54" y="1382" font-size="11.5" fill="#6C675A">Knoten verschwindet ganz</text>
<text x="54" y="1401" font-size="11.5" fill="#6C675A">T-Nut läuft zum Ende offen</text>
<rect x="421" y="1002" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="439" y="1032" font-size="16.5" font-weight="700" fill="#17160F">Halbschalen  ·  2 Teile</text>
<text x="439" y="1052" font-size="11.5" fill="#6C675A">Zwei gleiche Schalen klemmen den Knoten</text>
<g><circle cx="607.5" cy="1170.0" r="39.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><path d="M605.5 1131.0 A39.0 39.0 0 0 0 605.5 1209.0 L605.5 1220.7 A50.7 50.7 0 0 1 605.5 1119.3 Z" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><path d="M609.5 1131.0 A39.0 39.0 0 0 1 609.5 1209.0 L609.5 1220.7 A50.7 50.7 0 0 0 609.5 1119.3 Z" fill="#B9C8BE" stroke="#17160F" stroke-width="1.6"/><rect x="590.0" y="1209.0" width="35.1" height="35.1" rx="7.8" fill="#FBFAF7" stroke="#17160F" stroke-width="1.2"/><circle cx="607.5" cy="1226.5" r="14.6" fill="#55886B" stroke="#FBFAF7" stroke-width="1.2"/><path d="M607.5 1226.5 L607.5 1287.0" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/><text x="607.5" y="1088.1" font-size="10" fill="#D2452B" text-anchor="middle" font-family="Figtree, sans-serif">Trennung in der Mitte</text></g>
<text x="439" y="1363" font-size="11.5" fill="#17160F">Werkzeug: EIN Nest, kein Kern</text>
<text x="439" y="1382" font-size="11.5" fill="#6C675A">beide Teile identisch</text>
<text x="439" y="1401" font-size="11.5" fill="#6C675A">muss zuverlässig zusammenhalten</text>
<rect x="806" y="1002" width="373" height="429" rx="5" fill="#fff" stroke="#C9C4B6"/>
<text x="824" y="1032" font-size="16.5" font-weight="700" fill="#17160F">Überwurfband  ·  2 Teile</text>
<text x="824" y="1052" font-size="11.5" fill="#6C675A">Band presst die Schnur in eine Nut</text>
<g><rect x="902.8" y="1131.0" width="179.4" height="78.0" fill="#E6E2D8" stroke="#C9C4B6" stroke-width="1"/><rect x="937.9" y="1119.3" width="42.9" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="937.9" y="1209.0" width="42.9" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="980.8" y="1131.8" width="23.4" height="-0.8" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="980.8" y="1209.0" width="23.4" height="-0.8" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="1004.2" y="1119.3" width="42.9" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><rect x="1004.2" y="1209.0" width="42.9" height="11.7" fill="#B9C8BE" stroke="#17160F" stroke-width="1.4"/><circle cx="992.5" cy="1124.0" r="7.8" fill="#55886B"/><circle cx="992.5" cy="1216.0" r="7.8" fill="#55886B"/><rect x="979.2" y="1119.3" width="26.5" height="9.4" fill="#E0982F" stroke="#17160F" stroke-width="1"/><rect x="979.2" y="1211.3" width="26.5" height="9.4" fill="#E0982F" stroke="#17160F" stroke-width="1"/><path d="M992.5 1216.0 L992.5 1271.4" fill="none" stroke="#55886B" stroke-width="15.6" stroke-linecap="round" stroke-linejoin="round"/><text x="992.5" y="1068.6" font-size="10" fill="#E0982F" text-anchor="middle" font-family="Figtree, sans-serif">Band hält die Schnur in der Nut</text></g>
<text x="824" y="1363" font-size="11.5" fill="#17160F">Werkzeug: 2 × trivial</text>
<text x="824" y="1382" font-size="11.5" fill="#6C675A">Manschette ohne jedes Merkmal</text>
<text x="824" y="1401" font-size="11.5" fill="#6C675A">Band ist ein Verschleißteil</text>
</svg>